---
- name: Fetch the k3s kubeconfig to the laptop
  hosts: freshtrack
  become: true          # the file on the server belongs to root
  tasks:
    - name: Copy kubeconfig from the server to ~/.kube
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/freshtrack-k3s.yaml"
        flat: true      # save it with exactly this name (no extra folders)
