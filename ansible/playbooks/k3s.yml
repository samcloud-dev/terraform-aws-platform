---
- name: Install single-node k3s on the FreshTrack host
  hosts: freshtrack
  become: true

  vars:
    k3s_channel: stable            # which k3s release line to follow

  tasks:
    - name: Download the official k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Install k3s (skipped if k3s is already installed)
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_SKIP_SELINUX_RPM: "true"
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 600"

    - name: Make sure k3s is running and starts at boot
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Wait until the node reports Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: nodes
      until: "'Ready' in nodes.stdout and 'NotReady' not in nodes.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Show the node
      ansible.builtin.debug:
        var: nodes.stdout_lines
